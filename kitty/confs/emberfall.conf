# vim:ft=kitty
## name:     Emberfall
## author:   abhishek
## license:  MIT
## blurb:    Burning temple ukiyo-e — smoke-black ground, ember orange, vermilion and parchment.

dynamic_background_opacity yes
background_opacity 1.0

#: Basic colors
foreground              #E4D3B8
background              #160F0D
selection_foreground    #F5E7CF
selection_background    #4E2F22

#: Cursor colors
cursor                  #F0873F
cursor_text_color       #160F0D

#: URL underline color when hovering with mouse
url_color               #E8A05A

#: Window borders
active_border_color     #E0673A
inactive_border_color   #3A2822
bell_border_color       #F2B865

#: Titlebar
wayland_titlebar_color  system
macos_titlebar_color    system

#: Tab bar
active_tab_foreground   #160F0D
active_tab_background   #E0673A
inactive_tab_foreground #A08A76
inactive_tab_background #221714
tab_bar_background      #100A09

#: Marks
mark1_foreground #160F0D
mark1_background #F0873F
mark2_foreground #160F0D
mark2_background #F2B865
mark3_foreground #160F0D
mark3_background #B5697A

#: black
color0 #2B1E1A
color8 #584038

#: red — vermilion
color1 #C4432C
color9 #E05A38

#: green — smoke pine
color2  #8F9257
color10 #A9AC6E

#: yellow — ember gold
