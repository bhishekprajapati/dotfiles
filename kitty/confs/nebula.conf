# vim:ft=kitty
## name:     Nebula
## author:   abhishek
## license:  MIT
## blurb:    Deep indigo void with an electric-blue accent, pulled from a
##           swirling cyan/magenta/violet paint-marble wallpaper. One
##           persistent accent color (electric blue) keeps the UI calm;
##           the rest of the wallpaper's palette (cyan, magenta, teal,
##           gold) is reserved for the ANSI terminal colors only, so
##           nothing but the cursor/borders/tabs stays bright at rest.

dynamic_background_opacity yes
background_opacity 0.85

#: Basic colors
foreground              #d6d4e8
background              #0a0a18
selection_foreground    #0a0a18
selection_background    #4f7cff

#: Cursor colors
cursor                  #e6e6e6
cursor_text_color       #0a0a18

#: URL underline color when hovering with mouse
url_color               #4f7cff

#: Window borders
active_border_color     #4f7cff
inactive_border_color   #23223f
bell_border_color       #ff4fa3

#: Titlebar
wayland_titlebar_color  system
macos_titlebar_color    system

#: Tab bar
active_tab_foreground   #0a0a18
active_tab_background   #e6e6e6
inactive_tab_foreground #8b88a8
inactive_tab_background #14142b
tab_bar_background      #0a0a18

#: Marks
mark1_foreground #0a0a18
mark1_background #4f7cff
mark2_foreground #0a0a18
mark2_background #34d399
mark3_foreground #0a0a18
mark3_background #d946ef

#: black — void / muted violet-grey
color0 #14142b
color8 #4a4768

#: red — warm pink-red from the magenta streaks
color1 #ff4d6d
color9 #ff7a90

#: green — teal-green swirl accents
color2  #34d399
color10 #5eead4

#: yellow — gold glints in the swirl
color3  #f2c14e
color11 #ffd873

#: blue — dominant electric blue
color4  #4f7cff
color12 #7c9bff

#: magenta — vivid violet/magenta swirl core
color5  #d946ef
color13 #f472e0

#: cyan — turquoise swirl core
color6  #2dd4e6
color14 #67e8f9

#: white — soft lavender / near-white
color7  #d6d4e8
color15 #f4f3fb
